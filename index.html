<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0047bb">
<title>差費金額查詢系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@500;600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#f7fafd; --sand-deep:#eef4fb; --ink:#334155; --muted:#8291a3;
  --sea:#4075cc; --sea-deep:#0047bb; --sun:#22b573; --line:#e7eef6;
  --card:#ffffff;
  --shadow:0 14px 34px rgba(0,71,187,.12);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --display:'Noto Sans TC',"Microsoft JhengHei",sans-serif;
  --label:'Oswald',var(--display);
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);font-family:var(--display);
  background:
    radial-gradient(1100px 480px at 50% -120px, #dbeafe 0%, transparent 60%),
    linear-gradient(180deg, var(--sand) 0%, var(--sand) 100%);
  min-height:100vh;
}
::selection{background:var(--sun);color:#231a08}
header{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--sea-deep) 0%,var(--sea) 62%,#bcdcfb 100%);
  color:#fff;padding:34px 18px 58px;text-align:center;
}
header .eyebrow{
  font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:#e6f1fd;margin:0 0 10px;
}
header h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em;position:relative;z-index:1}
.header-wave{position:absolute;left:0;right:0;bottom:-1px;line-height:0}
.header-wave svg{width:100%;height:56px;display:block}
.container{max-width:960px;margin:-28px auto 24px;padding:0 16px;position:relative}
.card{
  background:var(--card);border-radius:20px;box-shadow:var(--shadow);
  border:1px solid var(--line);padding:20px;margin-bottom:16px;
}
.hero{display:flex;flex-direction:column;justify-content:center;margin-top:10px}
.hero .card{max-width:560px;margin:0 auto;width:100%;padding:22px 22px}
.announce-wrap{
  display:none;max-width:560px;margin:12px auto 0;flex-direction:column;gap:8px;
}
.announce-wrap.show{display:flex}
.announce{
  display:flex;background:#fff7e0;border:1px solid #f4dfa0;border-radius:14px;
  padding:12px 16px;align-items:center;gap:10px;box-shadow:var(--shadow);
}
.announce-icon{font-size:18px;flex-shrink:0}
.announce-text{flex:1;margin:0;font-size:14px;color:#7a5311;line-height:1.6;white-space:pre-wrap}
.badge-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.badge-plate{
  font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.08em;
  background:var(--sea-deep);color:#fff;border-radius:8px;padding:6px 10px;
}
.badge-caption{font-size:13px;color:var(--muted)}
.search-row{display:flex;gap:10px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:200px}
.search-box input{
  width:100%;height:54px;border:1.5px solid var(--line);border-radius:999px;
  padding:0 20px 0 48px;font-size:16px;outline:none;background:#fff;
  font-family:var(--display);color:var(--ink);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.search-box input::placeholder{color:#9aa39d}
.search-box input:focus{border-color:var(--sea);box-shadow:0 0 0 4px rgba(0,71,187,.15)}
.autocomplete{
  position:absolute;left:0;right:0;top:60px;z-index:20;display:none;
  background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 16px 34px rgba(0,71,187,.16);overflow:hidden;
}
.autocomplete.show{display:block}
.suggestion{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 15px;border:0;border-bottom:1px solid #eef3f8;border-radius:0;
  background:#fff;text-align:left;color:var(--ink);font-family:var(--display);cursor:pointer;
}
.suggestion:last-child{border-bottom:0}
.suggestion:hover,.suggestion.active{background:#f1f6ff}
.suggestion.exact{background:#e7f0ff;box-shadow:inset 4px 0 0 var(--sea-deep)}
.suggestion-main{min-width:0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.suggestion-main strong{font-weight:900}
.suggestion-meta{flex-shrink:0;color:var(--muted);font-size:11px}
.suggestion mark{background:#ffe58a;color:inherit;border-radius:3px;padding:0 1px}
.suggestion.exact mark{background:#9fc2ff}
.search-icon{position:absolute;left:19px;top:16px;font-size:19px;color:var(--muted)}
button{border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--display)}
.btn-primary{background:var(--sea-deep);color:#fff}
.btn-primary:hover{background:#003a99}
.btn-pill{border-radius:999px;height:54px;padding:0 30px}
.hint{margin:10px 2px 0;font-size:12px;color:var(--muted)}
#resultsSection{display:none}
#resultsSection.show{display:block}
.section-label{
  font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 4px 12px;
}
.ticket-list{display:flex;flex-direction:column;gap:14px}
.ticket{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:16px;box-shadow:var(--shadow);overflow:hidden;
  animation:rise .32s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ticket-top{padding:15px 20px}
.ticket-name{font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.town-tag{
  font-family:var(--label);font-weight:600;font-size:10.5px;letter-spacing:.05em;
  color:var(--sea-deep);background:#dbeafe;border-radius:7px;padding:3px 8px;
}
.code-tag{
  font-family:var(--mono);font-weight:700;font-size:10.5px;letter-spacing:.02em;
  color:var(--muted);background:var(--sand-deep);border-radius:7px;padding:3px 8px;
}
.ticket-perf{height:14px;margin:0;overflow:hidden;line-height:0}
.ticket-perf svg{width:100%;height:14px;display:block}
.ticket-bottom{display:flex;flex-wrap:wrap;padding:14px 20px 17px;gap:10px}
.ticket-fee,.ticket-dist,.ticket-extra{flex:1;min-width:120px}
.ticket-label{
  display:block;font-family:var(--label);font-weight:500;font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;
}
.ticket-value{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--sea-deep)}
.ticket-dist .ticket-value{color:var(--ink);font-size:18px}
.ticket-fee{border-right:1px solid var(--line)}
.ticket-extra{border-right:1px solid var(--line)}
.ticket-extra:last-child{border-right:0}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:15px}
.loading{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:600px){
  header{padding:26px 16px 40px}
  header h1{font-size:22px}
  .container{padding:0 12px}
  .card{padding:16px;border-radius:16px}
  .hero .card{padding:18px 16px}
  .announce-wrap{margin-top:8px}
  .autocomplete{top:59px}
  .suggestion{padding:11px 13px}
  .search-row button{flex:1}
  .ticket-bottom{flex-direction:column;gap:12px}
  .ticket-fee,.ticket-extra{border-right:0;border-bottom:1px solid var(--line);padding-bottom:10px}
  .ticket-extra:last-child{border-bottom:0;padding-bottom:0}
}
</style>
</head>
<body>
<header>
  <p class="eyebrow">台11線・東海岸・差費速算</p>
  <h1>📋 差費金額查詢系統</h1>
  <div class="header-wave" aria-hidden="true">
    <svg viewBox="0 0 1440 60" preserveAspectRatio="none">
      <path d="M0,30 C240,60 480,0 720,26 C960,52 1200,6 1440,30 L1440,60 L0,60 Z" fill="#ffffff" opacity=".18"/>
      <path d="M0,40 C240,14 480,58 720,36 C960,14 1200,54 1440,34 L1440,60 L0,60 Z" fill="var(--sand)"/>
    </svg>
  </div>
</header>

<main class="container">
  <section class="announce-wrap" id="announceWrap">
    <div class="announce-list" id="announceList"></div>
  </section>

  <section class="hero">
    <div class="card">
      <div class="badge-row">
        <span class="badge-plate">ROUTE 11</span>
        <span class="badge-caption">輸入地區、地段或段碼，查該地區(段)差費。</span>
      </div>
      <div class="search-row">
        <div class="search-box">
          <span class="search-icon">🔎</span>
          <input id="search" type="search" autocomplete="off" placeholder="輸入地區、地段或段碼，例如：台東市、福亨段、1047">
          <div class="autocomplete" id="autocomplete" role="listbox"></div>
        </div>
        <button class="btn-primary btn-pill" onclick="doSearch()">搜尋</button>
      </div>
      <p class="hint">輸入關鍵字即時顯示結果，可點選下方選項；也可按 Enter 查詢</p>
    </div>
  </section>

  <section id="resultsSection">
    <p class="section-label">查詢結果</p>
    <div class="ticket-list" id="tbody"></div>
  </section>
</main>

<script>
// ========== 請把下面網址換成你部署後的 Apps Script 網址 ==========
const API_URL = "https://script.google.com/macros/s/AKfycbzKzIiXl7bNtTzHUWdDIkE8OsTAIXXJqwBDwvBt77PJpVKm_dJ6z0RTjMemYEZWBvwe/exec";
// =================================================================

let data = [];
let announcements = [];
let interacted = false;
let activeSuggestion = -1;

async function loadData(){
  try{
    document.getElementById("tbody").innerHTML = '<div class="loading">資料載入中…</div>';
    const res = await fetch(API_URL + "?action=list");
    if(!res.ok) throw new Error("讀取失敗");
    const json = await res.json();
    data = json.items || [];
    announcements = json.announcements || [];
    data = data.map(x => {
      if(x.town === "其他") x.town = "轄區外";
      return x;
    });
    render();
  }catch(err){
    console.error(err);
    document.getElementById("tbody").innerHTML = '<div class="empty">無法從試算表載入資料，請檢查 API 網址或網路連線</div>';
  }
}

function render(){
  // 公告
  const wrap = document.getElementById("announceWrap");
  const list = document.getElementById("announceList");
  if(announcements.length){
    wrap.classList.add("show");
    list.innerHTML = announcements.map(a => `
      <div class="announce">
        <span class="announce-icon">📢</span>
        <p class="announce-text">${esc(a.text)}</p>
      </div>`).join("");
  }else{
    wrap.classList.remove("show");
    list.innerHTML = "";
  }

  const resultsSection = document.getElementById("resultsSection");
  const qRaw = document.getElementById("search").value.trim();
  const q = qRaw.toLowerCase();
  interacted = q.length > 0;
  if(!interacted){
    resultsSection.classList.remove("show");
    hideSuggestions();
    return;
  }
  resultsSection.classList.add("show");
  const filtered = data.filter(x =>
    (x.name||"").toLowerCase().includes(q) ||
    (x.town||"").toLowerCase().includes(q) ||
    String(x.code||"").toLowerCase().includes(q)
  );

  const tbody = document.getElementById("tbody");
  if(!filtered.length){
    tbody.innerHTML = '<div class="empty">找不到符合的地段資料</div>';
    return;
  }

  tbody.innerHTML = filtered.map(x => {
    const bus = x.bus == null ? null : Number(x.bus);
    const train = x.train == null ? null : Number(x.train);
    const oneWayTotal = (bus || 0) + (train || 0);
    const hasTransport = bus != null || train != null;

    let bottomHtml = "";

    if (x.town === "轄區外") {
      bottomHtml = `
        <div class="ticket-extra">
          <span class="ticket-label">客運金額（單趟）</span>
          <span class="ticket-value">${bus==null?"—":"$"+bus.toLocaleString()}</span>
        </div>
        <div class="ticket-extra">
          <span class="ticket-label">火車金額（單趟）</span>
          <span class="ticket-value">${train==null?"—":"$"+train.toLocaleString()}</span>
        </div>
        <div class="ticket-extra">
          <span class="ticket-label">單趟總額</span>
          <span class="ticket-value">${hasTransport?"$"+oneWayTotal.toLocaleString():"—"}</span>
        </div>
        <div class="ticket-extra">
          <span class="ticket-label">來回總額</span>
          <span class="ticket-value">${hasTransport?"$"+(oneWayTotal*2).toLocaleString():"—"}</span>
        </div>
        <div class="ticket-extra">
          <span class="ticket-label">雜費</span>
          <span class="ticket-value">${x.price==null?"—":"$"+Number(x.price).toLocaleString()}</span>
        </div>
      `;
    } else {
      bottomHtml = `
        <div class="ticket-fee">
          <span class="ticket-label">雜費</span>
          <span class="ticket-value">${x.price==null?"—":"$"+Number(x.price).toLocaleString()}</span>
        </div>
        <div class="ticket-dist">
          <span class="ticket-label">里程</span>
          <span class="ticket-value">${x.distance==null?"—":x.distance+" km"}</span>
        </div>
      `;
    }

    return `
    <div class="ticket">
      <div class="ticket-top">
        <div class="ticket-name">
          ${esc(x.name)}
          <span class="town-tag">${esc(x.town)}</span>
          ${x.code ? `<span class="code-tag">段碼 ${esc(x.code)}</span>` : ""}
        </div>
      </div>
      <div class="ticket-perf"><svg viewBox="0 0 300 14" preserveAspectRatio="none"><path d="M0,7 C25,0 50,14 75,7 C100,0 125,14 150,7 C175,0 200,14 225,7 C250,0 275,14 300,7" fill="none" stroke="var(--line)" stroke-width="2"/></svg></div>
      <div class="ticket-bottom">
        ${bottomHtml}
      </div>
    </div>`;
  }).join("");
}

function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

function normalize(s){
  return String(s ?? "").trim().toLowerCase();
}

function highlight(text, q){
  const safe = esc(text);
  if(!q) return safe;
  const safeQ = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try{
    return safe.replace(new RegExp(`(${safeQ})`, "gi"), "<mark>$1</mark>");
  }catch(e){ return safe; }
}

function getSuggestions(q){
  const query = normalize(q);
  if(!query) return [];
  const seen = new Set();
  return data.filter(x => {
    const name=normalize(x.name), town=normalize(x.town), code=normalize(x.code);
    return name.includes(query) || town.includes(query) || code.includes(query);
  }).filter(x => {
    const key = `${x.name}|${x.town}|${x.code}`;
    if(seen.has(key)) return false;
    seen.add(key); return true;
  }).sort((a,b)=>{
    const qa=query;
    const ae = [a.name,a.town,String(a.code||"")].some(v=>normalize(v)===qa);
    const be = [b.name,b.town,String(b.code||"")].some(v=>normalize(v)===qa);
    return Number(be)-Number(ae);
  }).slice(0,8);
}

function showSuggestions(){
  const input=document.getElementById("search");
  const box=document.getElementById("autocomplete");
  const q=input.value.trim();
  activeSuggestion=-1;
  if(!q || !data.length){ hideSuggestions(); return; }
  const items=getSuggestions(q);
  if(!items.length){ hideSuggestions(); return; }
  box.innerHTML=items.map((x,i)=>{
    const exact=[x.name,x.town,String(x.code||"")].some(v=>normalize(v)===normalize(q));
    const meta=[x.town, x.code ? `段碼 ${x.code}` : ""].filter(Boolean).join(" · ");
    return `<button type="button" class="suggestion ${exact?"exact":""}" data-index="${i}" onclick="chooseSuggestion(${i})">
      <span class="suggestion-main">🔎 <strong>${highlight(x.name||"",q)}</strong></span>
      <span class="suggestion-meta">${highlight(meta,q)}${exact?" ✓":""}</span>
    </button>`;
  }).join("");
  box.classList.add("show");
  box._items=items;
}

function hideSuggestions(){
  const box=document.getElementById("autocomplete");
  if(box){box.classList.remove("show");box.innerHTML="";box._items=[];}
  activeSuggestion=-1;
}

function chooseSuggestion(index){
  const box=document.getElementById("autocomplete");
  const items=box._items||[];
  const item=items[index];
  if(!item) return;
  document.getElementById("search").value=item.name || item.town || String(item.code||"");
  activeSuggestion=-1;
  hideSuggestions();
  interacted=true;
  render();
  document.getElementById("search").focus();
}

function doSearch(){
  interacted = document.getElementById("search").value.trim().length > 0;
  hideSuggestions();
  render();
}

document.getElementById("search").addEventListener("input", () => {
  interacted = document.getElementById("search").value.trim().length > 0;
  render();
  showSuggestions();
});

document.getElementById("search").addEventListener("keydown", e => {
  const box=document.getElementById("autocomplete");
  const items=box._items||[];
  if(e.key === "ArrowDown" && items.length){
    e.preventDefault();
    activeSuggestion=(activeSuggestion+1)%items.length;
    box.querySelectorAll(".suggestion").forEach((el,i)=>el.classList.toggle("active",i===activeSuggestion));
    return;
  }
  if(e.key === "ArrowUp" && items.length){
    e.preventDefault();
    activeSuggestion=(activeSuggestion-1+items.length)%items.length;
    box.querySelectorAll(".suggestion").forEach((el,i)=>el.classList.toggle("active",i===activeSuggestion));
    return;
  }
  if(e.key === "Enter"){
    if(activeSuggestion>=0 && items[activeSuggestion]){
      e.preventDefault();
      chooseSuggestion(activeSuggestion);
    }else{
      doSearch();
    }
  }
  if(e.key === "Escape") hideSuggestions();
});

document.addEventListener("click", e => {
  if(!e.target.closest(".search-box")) hideSuggestions();
});

loadData();
</script>
</body>
</html>
