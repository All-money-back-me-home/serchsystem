<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0047bb">
<title>差費金額查詢系統</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Oswald:wght@500;600&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f9fd;--bg2:#eef4fb;--ink:#26384d;--muted:#8190a3;--sea:#4075cc;--sea-deep:#0047bb;--line:#e2eaf3;--card:#fff;--gold-line:#f0d995;--shadow:0 10px 28px rgba(0,71,187,.09);--shadow2:0 16px 36px rgba(31,66,110,.14);--mono:'JetBrains Mono',ui-monospace,monospace;--display:'Noto Sans TC','Microsoft JhengHei',sans-serif;--label:'Oswald',var(--display)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:var(--display);background:radial-gradient(900px 360px at 50% -80px,#dbeafe 0%,transparent 65%),linear-gradient(180deg,var(--bg),var(--bg));min-height:100vh}::selection{background:#bcd7ff;color:#17345a}
header{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--sea-deep) 0%,var(--sea) 62%,#a9d0f7 100%);color:#fff;padding:28px 16px 50px;text-align:center}header .eyebrow{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.2em;color:#eaf4ff;margin:0 0 8px}header h1{margin:0;font-size:27px;font-weight:900;letter-spacing:.02em;position:relative;z-index:1}.header-wave{position:absolute;left:0;right:0;bottom:-1px;line-height:0}.header-wave svg{width:100%;height:52px;display:block}
.container{max-width:860px;margin:-17px auto 34px;padding:0 14px;position:relative}.announce-wrap{display:none;max-width:620px;margin:7px auto 9px}.announce-wrap.show{display:block}.announce-list{display:flex;flex-direction:column;gap:7px}.announce{display:flex;background:linear-gradient(135deg,#fffaf0,#fff6dd);border:1px solid var(--gold-line);border-radius:14px;padding:10px 14px;align-items:flex-start;gap:9px;box-shadow:0 6px 18px rgba(130,94,20,.08)}.announce-icon{font-size:18px;line-height:1.4;flex-shrink:0}.announce-text{flex:1;margin:0;font-size:13.5px;color:#77551a;line-height:1.55;white-space:pre-wrap}
.hero{display:flex;flex-direction:column}.hero .card{max-width:620px;margin:0 auto;width:100%}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:19px}.badge-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}.badge-plate{font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.08em;background:var(--sea-deep);color:#fff;border-radius:8px;padding:6px 10px;box-shadow:0 4px 10px rgba(0,71,187,.15)}.badge-caption{font-size:13px;color:var(--muted);font-weight:500}
.search-row{position:relative}.search-box{position:relative;width:100%}.search-box input{width:100%;height:56px;border:1.5px solid #dbe5ef;border-radius:15px;padding:0 50px 0 47px;font-size:16px;outline:none;background:#fbfdff;font-family:var(--display);color:var(--ink);font-weight:500;transition:.15s}.search-box input::placeholder{color:#9aa7b5}.search-box input:focus{background:#fff;border-color:var(--sea);box-shadow:0 0 0 4px rgba(64,117,204,.11)}.search-icon{position:absolute;left:16px;top:16px;font-size:20px;color:var(--muted);pointer-events:none;z-index:2}.clear-search{position:absolute;right:11px;top:11px;width:34px;height:34px;border-radius:50%;display:none;align-items:center;justify-content:center;background:#edf2f7;color:#647589;font-size:20px;line-height:1;cursor:pointer;z-index:3}.hint{margin:0 3px;font-size:11.5px;color:#91a0b0;line-height:1.5}
#resultsSection{display:none;max-width:620px;margin:8px auto 0}#resultsSection.show{display:block}.results-head{display:flex;align-items:center;justify-content:space-between;margin:0 3px 8px}.section-label{font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}.result-count{font-size:11px;color:var(--muted);background:#eaf1f8;border-radius:999px;padding:4px 9px}
.ticket-list{display:flex;flex-direction:column;gap:9px}.ticket{background:var(--card);border:1px solid #e1e9f2;border-radius:16px;box-shadow:0 6px 18px rgba(15,55,100,.07);overflow:hidden;animation:rise .22s ease both}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.ticket-top{padding:13px 17px 11px}.ticket-name{font-size:18px;font-weight:900;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.town-tag{font-family:var(--label);font-weight:600;font-size:10.5px;letter-spacing:.05em;color:var(--sea-deep);background:#dbeafe;border-radius:7px;padding:3px 8px}.code-tag{font-family:var(--mono);font-weight:700;font-size:10.5px;color:var(--muted);background:var(--bg2);border-radius:7px;padding:3px 8px}.ticket-perf{height:10px;margin:0;overflow:hidden;line-height:0}.ticket-perf svg{width:100%;height:10px;display:block}.ticket-bottom{display:flex;flex-wrap:wrap;padding:11px 17px 14px;gap:9px;background:#fcfdff}.ticket-fee,.ticket-dist,.ticket-extra{flex:1;min-width:120px}.ticket-label{display:block;font-family:var(--label);font-weight:500;font-size:10.5px;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}.ticket-value{font-family:var(--mono);font-weight:700;font-size:19px;color:var(--sea-deep)}.ticket-dist .ticket-value{color:var(--ink);font-size:17px}.ticket-fee,.ticket-extra{border-right:1px solid var(--line)}.ticket-extra:last-child{border-right:0}.empty,.loading{text-align:center;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:30px 18px;color:var(--muted);font-size:14px}.empty small{font-size:11px}
@media(max-width:600px){header{padding:23px 13px 39px}header .eyebrow{font-size:10.5px;letter-spacing:.15em}header h1{font-size:22px}.container{padding:0 10px;margin-top:-14px}.announce-wrap{margin:6px auto 7px}.announce{padding:9px 11px}.announce-text{font-size:12.5px}.hero .card{padding:16px 13px;border-radius:17px}.badge-row{gap:7px;margin-bottom:9px}.badge-caption{font-size:11.5px;line-height:1.45}.search-box input{height:54px;border-radius:14px;font-size:15px}.search-icon{top:15px}.clear-search{top:10px}.hint{font-size:11px}#resultsSection{margin-top:11px}.ticket-name{font-size:16.5px}.ticket-bottom{flex-direction:column;gap:9px}.ticket-fee,.ticket-extra{border-right:0;border-bottom:1px solid var(--line);padding-bottom:9px}.ticket-extra:last-child{border-bottom:0;padding-bottom:0}}
</style>
</head>
<body>
<header><p class="eyebrow">台11線・東海岸・差費速算</p><h1>📋 差費金額查詢系統</h1><div class="header-wave" aria-hidden="true"><svg viewBox="0 0 1440 60" preserveAspectRatio="none"><path d="M0,30 C240,60 480,0 720,26 C960,52 1200,6 1440,30 L1440,60 L0,60 Z" fill="#fff" opacity=".18"/><path d="M0,40 C240,14 480,58 720,36 C960,14 1200,54 1440,34 L1440,60 L0,60 Z" fill="var(--bg)"/></svg></div></header>
<main class="container">
<section class="announce-wrap" id="announceWrap"><div class="announce-list" id="announceList"></div></section>
<section class="hero"><div class="card">
<div class="badge-row"><span class="badge-plate">ROUTE 11</span><span class="badge-caption">輸入地區、地段或段碼，即時查詢差費</span></div>
<div class="search-row"><div class="search-box"><span class="search-icon">🔎</span><input id="search" type="search" autocomplete="off" placeholder="輸入地區、地段或段碼，例如：台東市、福亨段、1047"><span class="clear-search" id="clearSearch" aria-label="清除搜尋">×</span></div></div>
<p class="hint">可直接點選下方建議；輸入完整名稱或段碼時會自動標示</p>
</div></section>
<section id="resultsSection"><div class="results-head"><p class="section-label">查詢結果</p><span class="result-count" id="resultCount"></span></div><div class="ticket-list" id="tbody"></div></section>
</main>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzKzIiXl7bNtTzHUWdDIkE8OsTAIXXJqwBDwvBt77PJpVKm_dJ6z0RTjMemYEZWBvwe/exec";
let data=[],announcements=[];
const $=id=>document.getElementById(id);const normalize=v=>String(v??"").trim().toLowerCase();
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function highlight(text,q){const safe=esc(text);if(!q)return safe;const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"ig");return safe.replace(re,m=>`<span class="search-mark">${m}</span>`);}
async function loadData(){try{$("tbody").innerHTML='<div class="loading">資料載入中…</div>';const res=await fetch(API_URL+"?action=list");if(!res.ok)throw new Error("讀取失敗");const json=await res.json();data=(json.items||[]).map(x=>{if(x.town==="其他")x.town="轄區外";return x;});announcements=json.announcements||[];renderAnnouncements();}catch(err){console.error(err);$("tbody").innerHTML='<div class="empty">無法從試算表載入資料，請檢查 API 網址或網路連線</div>';}}
function renderAnnouncements(){const wrap=$("announceWrap"),list=$("announceList");if(announcements.length){wrap.classList.add("show");list.innerHTML=announcements.map(a=>`<div class="announce"><span class="announce-icon">📢</span><p class="announce-text">${esc(a.text)}</p></div>`).join("");}else{wrap.classList.remove("show");list.innerHTML="";}}
function getFiltered(q){if(!q)return [];return data.filter(x=>normalize(x.name).includes(q)||normalize(x.town).includes(q)||normalize(x.code).includes(q));}
function renderTicket(x){const bus=x.bus==null?null:Number(x.bus),train=x.train==null?null:Number(x.train),oneWayTotal=(bus||0)+(train||0),hasTransport=bus!=null||train!=null;let bottomHtml="";if(x.town==="轄區外"){bottomHtml=`<div class="ticket-extra"><span class="ticket-label">客運金額（單趟）</span><span class="ticket-value">${bus==null?"—":"$"+bus.toLocaleString()}</span></div><div class="ticket-extra"><span class="ticket-label">火車金額（單趟）</span><span class="ticket-value">${train==null?"—":"$"+train.toLocaleString()}</span></div><div class="ticket-extra"><span class="ticket-label">單趟總額</span><span class="ticket-value">${hasTransport?"$"+oneWayTotal.toLocaleString():"—"}</span></div><div class="ticket-extra"><span class="ticket-label">來回總額</span><span class="ticket-value">${hasTransport?"$"+(oneWayTotal*2).toLocaleString():"—"}</span></div><div class="ticket-extra"><span class="ticket-label">雜費</span><span class="ticket-value">${x.price==null?"—":"$"+Number(x.price).toLocaleString()}</span></div>`;}else{bottomHtml=`<div class="ticket-fee"><span class="ticket-label">雜費</span><span class="ticket-value">${x.price==null?"—":"$"+Number(x.price).toLocaleString()}</span></div><div class="ticket-dist"><span class="ticket-label">里程</span><span class="ticket-value">${x.distance==null?"—":x.distance+" km"}</span></div>`;}return `<div class="ticket"><div class="ticket-top"><div class="ticket-name">${esc(x.name)} <span class="town-tag">${esc(x.town)}</span> ${x.code?`<span class="code-tag">段碼 ${esc(x.code)}</span>`:""}</div></div><div class="ticket-perf"><svg viewBox="0 0 300 14" preserveAspectRatio="none"><path d="M0,7 C25,0 50,14 75,7 C100,0 125,14 150,7 C175,0 200,14 225,7 C250,0 275,14 300,7" fill="none" stroke="var(--line)" stroke-width="2"/></svg></div><div class="ticket-bottom">${bottomHtml}</div></div>`;}
function updateSearch(){const q=normalize($("search").value),results=$("resultsSection"),tbody=$("tbody"),count=$("resultCount"),clear=$("clearSearch");clear.style.display=q?"flex":"none";if(!q){results.classList.remove("show");count.textContent="";return;}const filtered=getFiltered(q);results.classList.add("show");count.textContent=`共 ${filtered.length} 筆`;if(!filtered.length){tbody.innerHTML='<div class="empty">找不到符合的地段資料<br><small>請試試地區名稱、地段名稱或段碼</small></div>';return;}tbody.innerHTML=filtered.map(renderTicket).join("");}
$("search").addEventListener("input",updateSearch);$("clearSearch").addEventListener("click",()=>{$("search").value="";updateSearch();$("search").focus();});loadData();
</script>
</body>
</html>
